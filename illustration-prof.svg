<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2644" />
      <stop offset="100%" stop-color="#173A63" />
    </linearGradient>
    <linearGradient id="flaskLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E3A27C" />
      <stop offset="100%" stop-color="#B66F4C" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F3F24" />
      <stop offset="100%" stop-color="#542E18" />
    </linearGradient>
  </defs>

  <!-- Fond de la salle de classe -->
  <rect width="600" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Sol / bas de scène -->
  <rect y="330" width="600" height="70" fill="#0A1B31" />
  <line x1="0" y1="330" x2="600" y2="330" stroke="#8E5236" stroke-width="3" />

  <!-- Tableau noir / tableau de sciences -->
  <rect x="40" y="35" width="340" height="230" rx="8" fill="#0A1B31" stroke="#8E5236" stroke-width="6" />
  <!-- Rainure à craies -->
  <rect x="35" y="265" width="350" height="8" rx="2" fill="#B66F4C" />
  <rect x="70" y="262" width="22" height="4" rx="1" fill="#FFFFFF" opacity="0.9" />
  <rect x="105" y="262" width="18" height="4" rx="1" fill="#E3A27C" opacity="0.9" />

  <!-- Écritures et schémas au tableau (PCT) -->
  <g font-family="system-ui, sans-serif" fill="#F0E4D0" opacity="0.9">
    <text x="65" y="75" font-size="16" font-weight="bold" fill="#E3A27C">PCT • Classe de 3ème</text>
    <text x="65" y="105" font-size="14" fill="#FFFFFF">1. Réaction d'oxydoréduction :</text>
    <text x="80" y="132" font-size="15" font-weight="bold" fill="#E3A27C">2 H₂ + O₂ ➔ 2 H₂O</text>
    
    <text x="65" y="165" font-size="14" fill="#FFFFFF">2. Loi d'Ohm :</text>
    <text x="80" y="192" font-size="16" font-weight="bold" fill="#F0E4D0">U = R × I</text>
  </g>

  <!-- Schéma molécule & circuit au tableau -->
  <g stroke="#3A6EA5" stroke-width="2" fill="none" opacity="0.8">
    <!-- Atome / Molécule -->
    <circle cx="285" cy="115" r="14" stroke="#E3A27C" stroke-width="2" fill="#B66F4C" fill-opacity="0.2" />
    <circle cx="260" cy="135" r="9" stroke="#F0E4D0" stroke-width="1.5" />
    <circle cx="310" cy="135" r="9" stroke="#F0E4D0" stroke-width="1.5" />
    <line x1="275" y1="122" x2="266" y2="128" stroke="#F0E4D0" stroke-width="2" />
    <line x1="295" y1="122" x2="304" y2="128" stroke="#F0E4D0" stroke-width="2" />

    <!-- Circuit électrique simple au tableau -->
    <rect x="245" y="175" width="95" height="55" rx="4" stroke="#F0E4D0" stroke-dasharray="4,3" />
    <circle cx="292" cy="175" r="7" fill="#0A1B31" stroke="#E3A27C" />
    <line x1="288" y1="171" x2="296" y2="179" stroke="#E3A27C" />
    <line x1="288" y1="179" x2="296" y2="171" stroke="#E3A27C" />
  </g>

  <!-- Paillasse / Table d'expérience -->
  <rect x="240" y="270" width="330" height="75" rx="6" fill="#173A63" stroke="#24507F" stroke-width="2" />
  <rect x="235" y="266" width="340" height="8" rx="2" fill="#B66F4C" />

  <!-- Matériel de laboratoire sur la table -->
  <!-- Support et fiole Erlenmeyer -->
  <g>
    <!-- Fiole Erlenmeyer -->
    <path d="M 285 220 L 295 220 L 295 233 L 315 264 A 4 4 0 0 1 312 268 L 268 268 A 4 4 0 0 1 265 264 L 285 233 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Liquide coloré dans la fiole -->
    <path d="M 273 250 L 307 250 L 313 264 A 2 2 0 0 1 311 266 L 269 266 A 2 2 0 0 1 267 264 Z" 
          fill="url(#flaskLiquid)" opacity="0.9" />
    <!-- Bulles d'expérience -->
    <circle cx="288" cy="256" r="2.5" fill="#FFFFFF" opacity="0.8" />
    <circle cx="295" cy="245" r="2" fill="#FFFFFF" opacity="0.8" />
    <circle cx="282" cy="240" r="1.5" fill="#FFFFFF" opacity="0.6" />

    <!-- Support à tubes à essais -->
    <rect x="335" y="235" width="60" height="32" rx="3" fill="#8E5236" opacity="0.9" />
    <!-- Tubes à essais -->
    <rect x="345" y="215" width="8" height="35" rx="4" fill="#FFFFFF" stroke="#24507F" stroke-width="1" opacity="0.85" />
    <rect x="345" y="232" width="8" height="17" rx="3" fill="#3A6EA5" opacity="0.9" />

    <rect x="360" y="212" width="8" height="38" rx="4" fill="#FFFFFF" stroke="#24507F" stroke-width="1" opacity="0.85" />
    <rect x="360" y="228" width="8" height="21" rx="3" fill="#D08A63" opacity="0.9" />

    <rect x="375" y="217" width="8" height="33" rx="4" fill="#FFFFFF" stroke="#24507F" stroke-width="1" opacity="0.85" />
    <rect x="375" y="235" width="8" height="14" rx="3" fill="#16a34a" opacity="0.85" />

    <!-- Cahier de fiches pédagogiques ouvert -->
    <polygon points="420,255 455,248 480,253 445,263" fill="#F0E4D0" stroke="#E2D1B5" stroke-width="1" />
    <polygon points="455,248 490,252 475,264 445,263" fill="#FFFFFF" stroke="#E2D1B5" stroke-width="1" />
    <!-- Stylo -->
    <line x1="435" y1="245" x2="455" y2="242" stroke="#B66F4C" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- L'Enseignant africain (chaleureux, souriant et professionnel) -->
  <g id="enseignant">
    <!-- Corps / Chemise professionnelle -->
    <path d="M 450 345 L 435 240 Q 480 220 525 240 L 510 345 Z" fill="#B66F4C" />
    
    <!-- Col de chemise et cravate / veste -->
    <polygon points="465,232 480,265 495,232" fill="#F0E4D0" />
    <polygon points="475,245 485,245 487,285 480,295 473,285" fill="#173A63" />

    <!-- Bras gauche tenant une baguette pédagogique vers le tableau -->
    <path d="M 440 245 L 390 220 Q 385 215 395 210 L 445 235 Z" fill="#8E5236" />
    <!-- Main gauche -->
    <circle cx="388" cy="214" r="8" fill="url(#skinGrad)" />
    <!-- Baguette / pointeur pédagogique pointant la réaction chimique -->
    <line x1="388" y1="214" x2="235" y2="135" stroke="#E3A27C" stroke-width="3" stroke-linecap="round" />

    <!-- Bras droit posé vers la table d'expérience -->
    <path d="M 520 245 L 535 285 L 505 295 L 498 255 Z" fill="#8E5236" />
    <circle cx="535" cy="290" r="8" fill="url(#skinGrad)" />

    <!-- Cou -->
    <rect x="470" y="200" width="20" height="35" rx="4" fill="url(#skinGrad)" />

    <!-- Tête / Visage -->
    <ellipse cx="480" cy="180" rx="26" ry="32" fill="url(#skinGrad)" />

    <!-- Cheveux soignés -->
    <path d="M 454 175 Q 452 145 480 145 Q 508 145 506 175 C 504 152 456 152 454 175 Z" fill="#0A1B31" />

    <!-- Yeux souriants & bienveillants -->
    <ellipse cx="470" cy="176" rx="3.5" ry="3" fill="#FFFFFF" />
    <circle cx="470" cy="176" r="2" fill="#0A1B31" />
    
    <ellipse cx="490" cy="176" rx="3.5" ry="3" fill="#FFFFFF" />
    <circle cx="490" cy="176" r="2" fill="#0A1B31" />

    <!-- Sourcils expressifs -->
    <path d="M 464 168 Q 470 165 476 168" stroke="#0A1B31" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 484 168 Q 490 165 496 168" stroke="#0A1B31" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Nez -->
    <path d="M 480 178 Q 483 186 480 188" stroke="#45230F" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Sourire chaleureux -->
    <path d="M 468 195 Q 480 206 492 195" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 468 195 Q 480 208 492 195" stroke="#45230F" stroke-width="1.5" fill="none" />

    <!-- Lunettes élégantes (optionnel, pour accentuer le côté professoral) -->
    <rect x="462" y="171" width="16" height="12" rx="3" fill="none" stroke="#E3A27C" stroke-width="1.8" />
    <rect x="482" y="171" width="16" height="12" rx="3" fill="none" stroke="#E3A27C" stroke-width="1.8" />
    <line x1="478" y1="176" x2="482" y2="176" stroke="#E3A27C" stroke-width="1.8" />
  </g>

  <!-- Badge discret "ProfÉclair PCT" -->
  <g transform="translate(435, 20)">
    <rect width="130" height="32" rx="16" fill="#173A63" stroke="#E3A27C" stroke-width="1.5" />
    <text x="65" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#F0E4D0" text-anchor="middle">
      ProfÉclair • Sciences
    </text>
  </g>
</svg>
